name: 缺陷报告
description: 仅使用合成数据复现；漏洞细节请走内部渠道
title: '[缺陷] '
body:
  - type: input
    id: version
    attributes:
      label: 提交SHA、环境和浏览器
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、实际结果、预期结果和URS
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏证据与影响范围
      description: 不得粘贴密码、真实检验记录或个人信息。
    validations:
      required: true
